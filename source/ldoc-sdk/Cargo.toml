[package]
name = "ldoc-sdk"
version = "1.0.0"
edition = "2021"
description = "LDOC SDK — clean public API wrapping ldoc-core and ldoc-runtime"
license = "MIT"

[lib]
name = "ldoc_sdk"
path = "src/lib.rs"

[[bin]]
name = "ldoc-server"
path = "src/server_main.rs"

[[bin]]
name = "ldoc-mcp-documents"
path = "src/mcp_documents_main.rs"

[[bin]]
name = "ldoc-mcp-formats"
path = "src/mcp_formats_main.rs"

[[bin]]
name = "ldoc-mcp-security"
path = "src/mcp_security_main.rs"

[[bin]]
name = "ldoc-mcp-forms"
path = "src/mcp_forms_main.rs"

[[bin]]
name = "ldoc-mcp-ai"
path = "src/mcp_ai_main.rs"

[[bin]]
name = "ldoc-launcher"
path = "src/ldoc_launcher.rs"

[[test]]
name = "sdk_tests"
path = "tests/sdk_tests.rs"

[[test]]
name = "security_tests"
path = "tests/security_tests.rs"

[[test]]
name = "plugin_tests"
path = "tests/plugin_tests.rs"

[[test]]
name = "server_tests"
path = "tests/server_tests.rs"

[dependencies]
ldoc-core    = { path = "../ldoc-core",    version = "1.0.0" }
ldoc-runtime = { path = "../ldoc-runtime", version = "2.0.0" }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
uuid         = { version = "1", features = ["v4"] }
chrono       = { version = "0.4", features = ["serde"] }
thiserror    = "1"
tiny_http    = "0.12"
sha2         = "0.10"
hex          = "0.4"
reqwest      = { version = "0.12", features = ["blocking", "json"] }
svg          = "0.13"
tobj         = "4.0"
stl_io       = "0.7"
xml-rs       = "0.8"
flate2       = "1.0"
