[package]
name = "ldoc-core"
version = "1.0.0"
edition = "2021"
description = "LDOC format core library — Phase 1 specification implementation"
license = "MIT"

[[bin]]
name = "ldoc"
path = "src/main.rs"

[lib]
name = "ldoc_core"
path = "src/lib.rs"

[[test]]
name = "phase1_tests"
path = "../tests/phase1/phase1_tests.rs"

[features]
plugin-wasm = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
crc32fast = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
base64 = "0.22"
hex = "0.4"
reqwest = { version = "0.11", features = ["blocking"] }

